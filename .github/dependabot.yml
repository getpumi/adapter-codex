# Dependabot updates the pins it supports (decision 0115): the SHAs of the
# GitHub Actions, go.mod and the golang base image of the devcontainer. Each
# update is a pull request of its own (decision 0116).

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
